server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # /confidentialite et /conditions marchent aussi sans « .html ».
  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public";
  }

  gzip on;
  gzip_types text/css text/html image/svg+xml;
}
