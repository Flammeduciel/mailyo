plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.mailyo'
version = '1.0.0'

android {
  namespace "expo.modules.mailyoimap"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
  packagingOptions {
    resources {
      excludes += ['META-INF/LICENSE.md', 'META-INF/NOTICE.md', 'META-INF/mailcap', 'META-INF/javamail.*']
    }
  }
}

dependencies {
  // JavaMail built for Android (IMAP, SMTP, MIME), no java.awt dependency.
  implementation 'com.sun.mail:android-mail:1.6.7'
  implementation 'com.sun.mail:android-activation:1.6.7'
  implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2")
  implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2")
}
